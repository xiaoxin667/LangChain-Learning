<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 24px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 700px at 50% 18%, #e6f4fb 0%, #c2dcea 55%, #a9cbdd 100%);
  }
  .card {
    background: #fff; border-radius: 24px; padding: 16px;
    box-shadow: 0 30px 70px rgba(24, 58, 84, .22), 0 4px 14px rgba(24, 58, 84, .10);
  }
  svg { display: block; width: min(92vw, 880px); height: auto; border-radius: 14px; }
  .caption { margin: 0; color: #52708a; font-size: 14px; letter-spacing: .04em; }
  .caption b { color: #35506b; }
</style>
</head>
<body>

<div class="card">
<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="一只鹈鹕骑着自行车前进的2D动画">
  <title>鹈鹕骑自行车</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0ee"/>
      <stop offset="1" stop-color="#eaf7fd"/>
    </linearGradient>
    <linearGradient id="roadG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d5f6a"/>
      <stop offset="1" stop-color="#454752"/>
    </linearGradient>
    <radialGradient id="sunG">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="1" stop-color="#ffd166"/>
    </radialGradient>

    <g id="cloud" fill="#ffffff">
      <ellipse cx="0" cy="0" rx="38" ry="20"/>
      <ellipse cx="32" cy="6" rx="28" ry="15"/>
      <ellipse cx="-32" cy="7" rx="26" ry="14"/>
      <ellipse cx="2" cy="-11" rx="24" ry="14"/>
    </g>

    <g id="bush">
      <circle cx="-13" cy="-3" r="9"/>
      <circle cx="0" cy="-8" r="12"/>
      <circle cx="13" cy="-3" r="9"/>
    </g>

    <!-- 车轮模板：辐条组持续旋转 -->
    <g id="wheel">
      <circle r="78" fill="none" stroke="#31353b" stroke-width="13"/>
      <circle r="69" fill="none" stroke="#cfd4da" stroke-width="3"/>
      <g stroke="#b7bdc6" stroke-width="2.5">
        <animateTransform attributeName="transform" type="rotate"
          from="0 0 0" to="360 0 0" dur="1.5s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="66" y2="0"/>
        <line x1="0" y1="0" x2="66" y2="0" transform="rotate(45)"/>
        <line x1="0" y1="0" x2="66" y2="0" transform="rotate(90)"/>
        <line x1="0" y1="0" x2="66" y2="0" transform="rotate(135)"/>
        <line x1="0" y1="0" x2="66" y2="0" transform="rotate(180)"/>
        <line x1="0" y1="0" x2="66" y2="0" transform="rotate(225)"/>
        <line x1="0" y1="0" x2="66" y2="0" transform="rotate(270)"/>
        <line x1="0" y1="0" x2="66" y2="0" transform="rotate(315)"/>
        <circle cx="66" cy="0" r="3.2" fill="#8d939b" stroke="none"/>
      </g>
      <circle r="10" fill="#3f454d"/>
      <circle r="4" fill="#9aa0a8"/>
    </g>
  </defs>

  <!-- ======== 背景 ======== -->
  <rect width="900" height="600" fill="url(#sky)"/>

  <!-- 太阳 -->
  <g transform="translate(118,102)">
    <g stroke="#ffd166" stroke-width="4.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate"
        from="0 0 0" to="360 0 0" dur="55s" repeatCount="indefinite"/>
      <line x1="0" y1="-52" x2="0" y2="-66"/>
      <line x1="0" y1="-52" x2="0" y2="-66" transform="rotate(45)"/>
      <line x1="0" y1="-52" x2="0" y2="-66" transform="rotate(90)"/>
      <line x1="0" y1="-52" x2="0" y2="-66" transform="rotate(135)"/>
      <line x1="0" y1="-52" x2="0" y2="-66" transform="rotate(180)"/>
      <line x1="0" y1="-52" x2="0" y2="-66" transform="rotate(225)"/>
      <line x1="0" y1="-52" x2="0" y2="-66" transform="rotate(270)"/>
      <line x1="0" y1="-52" x2="0" y2="-66" transform="rotate(315)"/>
    </g>
    <circle r="38" fill="url(#sunG)"/>
  </g>

  <!-- 云（不同速度飘过） -->
  <g transform="translate(0,105)"><g>
    <animateTransform attributeName="transform" type="translate"
      from="-280 0" to="1180 0" dur="46s" begin="-12s" repeatCount="indefinite"/>
    <use href="#cloud" transform="scale(1.15)"/>
  </g></g>
  <g transform="translate(0,172)"><g>
    <animateTransform attributeName="transform" type="translate"
      from="-280 0" to="1180 0" dur="64s" begin="-40s" repeatCount="indefinite"/>
    <use href="#cloud" transform="scale(0.8)"/>
  </g></g>
  <g transform="translate(0,64)" opacity="0.85"><g>
    <animateTransform attributeName="transform" type="translate"
      from="-280 0" to="1180 0" dur="82s" begin="-60s" repeatCount="indefinite"/>
    <use href="#cloud" transform="scale(0.62)"/>
  </g></g>

  <!-- 远山 -->
  <path d="M0,514 Q130,428 280,514 Q420,438 560,514 Q700,442 900,514 Z" fill="#cfe3ba"/>
  <path d="M0,514 Q160,476 330,514 Q500,470 660,514 Q790,478 900,514 Z" fill="#b4d69c"/>

  <!-- 马路（虚线向后滚动） -->
  <rect y="514" width="900" height="86" fill="url(#roadG)"/>
  <rect y="514" width="900" height="5" fill="#73757f"/>
  <line x1="0" y1="558" x2="900" y2="558" stroke="#f6d76c" stroke-width="6" stroke-dasharray="42 34">
    <animate attributeName="stroke-dashoffset" from="0" to="76" dur="0.24s" repeatCount="indefinite"/>
  </line>

  <!-- 路边灌木（无缝滚动） -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      from="0 0" to="-900 0" dur="2.8s" repeatCount="indefinite"/>
    <use href="#bush" x="40"  y="508" fill="#7fb569"/>
    <use href="#bush" x="190" y="510" fill="#8fc27a"/>
    <use href="#bush" x="340" y="507" fill="#7fb569"/>
    <use href="#bush" x="490" y="510" fill="#8fc27a"/>
    <use href="#bush" x="640" y="508" fill="#7fb569"/>
    <use href="#bush" x="790" y="510" fill="#8fc27a"/>
    <use href="#bush" x="940"  y="508" fill="#7fb569"/>
    <use href="#bush" x="1090" y="510" fill="#8fc27a"/>
    <use href="#bush" x="1240" y="507" fill="#7fb569"/>
    <use href="#bush" x="1390" y="510" fill="#8fc27a"/>
    <use href="#bush" x="1540" y="508" fill="#7fb569"/>
    <use href="#bush" x="1690" y="510" fill="#8fc27a"/>
  </g>

  <!-- 速度线 -->
  <g stroke="#dceef8" stroke-width="5" stroke-linecap="round">
    <line x1="150" y1="252" x2="238" y2="252">
      <animateTransform attributeName="transform" type="translate"
        from="40 0" to="-160 0" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="0.7s" repeatCount="indefinite"/>
    </line>
    <line x1="118" y1="305" x2="222" y2="305">
      <animateTransform attributeName="transform" type="translate"
        from="40 0" to="-160 0" dur="0.7s" begin="-0.25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="0.7s" begin="-0.25s" repeatCount="indefinite"/>
    </line>
    <line x1="140" y1="352" x2="230" y2="352">
      <animateTransform attributeName="transform" type="translate"
        from="40 0" to="-160 0" dur="0.7s" begin="-0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="0.7s" begin="-0.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 后轮扬起的尘土 -->
  <g fill="#c9ced6">
    <circle cx="238" cy="500" r="7">
      <animate attributeName="opacity" from="0.5" to="0" dur="0.9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
        from="0 0" to="-75 -10" dur="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="222" cy="506" r="5">
      <animate attributeName="opacity" from="0.5" to="0" dur="0.9s" begin="-0.3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
        from="0 0" to="-70 -6" dur="0.9s" begin="-0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="495" r="4">
      <animate attributeName="opacity" from="0.5" to="0" dur="0.9s" begin="-0.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
        from="0 0" to="-80 -14" dur="0.9s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 阴影 -->
  <ellipse cx="455" cy="518" rx="185" ry="9" fill="#1c2430" opacity="0.15"/>

  <!-- ======== 自行车 + 鹈鹕 ======== -->
  <!-- 远侧曲柄 / 远侧踏板和脚 / 远侧腿 -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      from="180 445 430" to="540 445 430" dur="1.6s" repeatCount="indefinite"/>
    <line x1="445" y1="430" x2="490" y2="430" stroke="#262b31" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" dur="1.6s" repeatCount="indefinite"
      values="400 430;413.2 398.2;445 385;476.8 398.2;490 430;476.8 461.8;445 475;413.2 461.8;400 430"/>
    <rect x="-15" y="-4" width="30" height="8" rx="3" fill="#2c3138"/>
    <path d="M-4,-4 L28,-4 L20,-15 L-2,-11 Z" fill="#cf8527"/>
  </g>
  <path d="M398,336 L461.6,365.3 L407,421" fill="none" stroke="#ded9c6" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite" values="
      M398,336 L461.6,365.3 L407,421;
      M398,336 L467.4,327.1 L420.2,389.2;
      M398,336 L456.9,298.2 L452,376;
      M398,336 L464.4,313.7 L483.8,389.2;
      M398,336 L466.8,349.1 L497,421;
      M398,336 L450.6,382.3 L483.8,452.8;
      M398,336 L444.5,388.4 L452,466;
      M398,336 L451.4,381.3 L420.2,452.8;
      M398,336 L461.6,365.3 L407,421"/>
  </path>

  <!-- 车轮 -->
  <use href="#wheel" transform="translate(325 430)"/>
  <use href="#wheel" transform="translate(585 430)"/>

  <!-- 车架 -->
  <g stroke="#ef5b6c" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M325,430 L445,430"/>
    <path d="M325,430 L403,335"/>
    <path d="M445,430 L401,330"/>
    <path d="M445,430 L571,337"/>
    <path d="M401,332 L569,329"/>
    <path d="M569,326 L573,342" stroke-width="10"/>
    <path d="M570,332 L585,430" stroke-width="8"/>
  </g>
  <!-- 车把 -->
  <g stroke="#3f454d" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M570,332 L562,308"/>
    <path d="M562,308 Q586,298 596,313"/>
  </g>
  <circle cx="596" cy="313" r="5.5" fill="#4a3b32"/>

  <!-- 链条与牙盘 -->
  <circle cx="325" cy="430" r="12" fill="#dfe3e8" stroke="#9aa0a8" stroke-width="2.5"/>
  <line x1="327" y1="419" x2="445" y2="410" stroke="#6b7076" stroke-width="3.5" stroke-dasharray="5 4">
    <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="0.45s" repeatCount="indefinite"/>
  </line>
  <line x1="327" y1="441" x2="445" y2="450" stroke="#6b7076" stroke-width="3.5" stroke-dasharray="5 4">
    <animate attributeName="stroke-dashoffset" from="0" to="18" dur="0.45s" repeatCount="indefinite"/>
  </line>
  <circle cx="445" cy="430" r="20" fill="#e7eaee" stroke="#9aa0a8" stroke-width="3"/>
  <g fill="#aab2bb">
    <animateTransform attributeName="transform" type="rotate"
      from="0 445 430" to="360 445 430" dur="1.6s" repeatCount="indefinite"/>
    <circle cx="445" cy="418" r="2.6"/>
    <circle cx="457" cy="430" r="2.6"/>
    <circle cx="445" cy="442" r="2.6"/>
    <circle cx="433" cy="430" r="2.6"/>
  </g>
  <circle cx="445" cy="430" r="7" fill="#b9bfc7"/>

  <!-- ======== 鹈鹕（身体轻微起伏） ======== -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 -1.5;0 2.5;0 -1.5" dur="1.7s" repeatCount="indefinite"/>

    <!-- 尾羽 -->
    <path d="M348,275 L302,256 L342,291 Z" fill="#efece0" stroke="#ddd6c8" stroke-width="1.5"/>
    <path d="M346,292 L294,290 L344,304 Z" fill="#efece0" stroke="#ddd6c8" stroke-width="1.5"/>

    <!-- 身体 -->
    <ellipse cx="415" cy="292" rx="76" ry="58" fill="#fbfaf5" stroke="#ddd6c8" stroke-width="2"/>
    <ellipse cx="425" cy="316" rx="56" ry="26" fill="#eee9db"/>

    <!-- 脖子 -->
    <path d="M468,264 C508,252 488,204 514,178" fill="none" stroke="#ddd6c8" stroke-width="30" stroke-linecap="round"/>
    <path d="M468,264 C508,252 488,204 514,178" fill="none" stroke="#fbfaf5" stroke-width="26" stroke-linecap="round"/>

    <!-- 围巾（随风飘动） -->
    <path fill="#c93a4d" d="M458,256 Q418,248 388,262 Q362,273 338,266 Q364,260 390,250 Q418,240 458,248 Z">
      <animate attributeName="d" dur="0.8s" repeatCount="indefinite" values="
        M458,256 Q418,248 388,262 Q362,273 338,266 Q364,260 390,250 Q418,240 458,248 Z;
        M458,256 Q418,258 388,270 Q362,281 338,274 Q364,268 390,256 Q418,250 458,248 Z;
        M458,256 Q418,248 388,262 Q362,273 338,266 Q364,260 390,250 Q418,240 458,248 Z"/>
    </path>
    <path d="M450,266 Q470,250 495,253" fill="none" stroke="#e0475a" stroke-width="13" stroke-linecap="round"/>

    <!-- 头部（轻微点头） -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-2.2 514 190;2.2 514 190;-2.2 514 190" dur="1.6s" repeatCount="indefinite"/>
      <path d="M498,150 Q492,136 480,138 Q491,143 492,153 Z" fill="#efece0"/>
      <path d="M533,153 Q604,157 664,185 Q602,176 534,170 Z" fill="#f0a03a"/>
      <!-- 喉囊（有节奏地鼓动） -->
      <path fill="#e8893b" d="M536,172 Q600,178 656,187 Q630,238 570,214 Q540,196 536,172 Z">
        <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="
          M536,172 Q600,178 656,187 Q630,238 570,214 Q540,196 536,172 Z;
          M536,172 Q600,178 656,187 Q634,252 566,220 Q540,196 536,172 Z;
          M536,172 Q600,178 656,187 Q630,238 570,214 Q540,196 536,172 Z"/>
      </path>
      <circle cx="517" cy="170" r="24" fill="#fbfaf5" stroke="#ddd6c8" stroke-width="1.5"/>
      <ellipse cx="521" cy="159" rx="7.5" ry="8.5" fill="#f7ead2"/>
      <ellipse cx="523" cy="158" rx="3.2" ry="3.2" fill="#26221f">
        <animate attributeName="ry" values="3.2;3.2;0.3;3.2;3.2"
          keyTimes="0;0.42;0.47;0.52;1" dur="4.6s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="524.2" cy="156.6" r="1.1" fill="#ffffff">
        <animate attributeName="opacity" values="1;1;0;1;1"
          keyTimes="0;0.42;0.47;0.52;1" dur="4.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- 翅膀搭在车把上（轻微摆动） -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-2.4 434 266;2.2 434 266;-2.4 434 266" dur="1.6s" repeatCount="indefinite"/>
      <path d="M434,260 Q512,256 586,302 Q600,310 590,318 Q526,288 466,294 Q432,294 430,272 Z"
            fill="#f4f1e7" stroke="#ddd6c8" stroke-width="2" stroke-linejoin="round"/>
      <path d="M462,284 Q516,288 560,306" fill="none" stroke="#ddd6c8" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 车座（压在身体下方） -->
  <rect x="378" y="344" width="52" height="11" rx="5" fill="#4a3b32"/>

  <!-- 近侧曲柄 / 近侧腿 / 近侧踏板和脚 -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      from="0 445 430" to="360 445 430" dur="1.6s" repeatCount="indefinite"/>
    <line x1="445" y1="430" x2="490" y2="430" stroke="#3f454d" stroke-width="7" stroke-linecap="round"/>
  </g>
  <path d="M414,334 L483.2,344.2 L497,421" fill="none" stroke="#f3efdf" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite" values="
      M414,334 L483.2,344.2 L497,421;
      M414,334 L470,376 L483.8,452.8;
      M414,334 L458.3,388.3 L452,466;
      M414,334 L460.7,386.1 L420.2,452.8;
      M414,334 L470.4,375.5 L407,421;
      M414,334 L483.4,343.4 L420.2,389.2;
      M414,334 L476.2,301.8 L452,376;
      M414,334 L480.2,311.3 L483.8,389.2;
      M414,334 L483.2,344.2 L497,421"/>
  </path>
  <g>
    <animateTransform attributeName="transform" type="translate" dur="1.6s" repeatCount="indefinite"
      values="490 430;476.8 461.8;445 475;413.2 461.8;400 430;413.2 398.2;445 385;476.8 398.2;490 430"/>
    <rect x="-15" y="-4" width="30" height="8" rx="3" fill="#3f454d"/>
    <path d="M-4,-4 L28,-4 L20,-15 L-2,-11 Z" fill="#f2a93b"/>
  </g>
</svg>
</div>

<p class="caption">鹈鹕骑行 · 纯 <b>SVG + SMIL</b> 2D 动画</p>

</body>
</html>
