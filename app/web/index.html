<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>综测问答助手</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-title">
        <h1>📚 综测问答助手</h1>
        <p class="subtitle">基于综测规则文档的 RAG 问答 · Embedding 检索 + LLM 生成 · 回答可溯源</p>
      </div>
      <span id="status-badge" class="badge" title="接口连接状态，见 api.js 配置"></span>
    </header>

    <main id="chat" class="chat">
      <div class="welcome">
        <div class="welcome-icon">🎓</div>
        <h2>你好，请问想查询什么综测规则？</h2>
        <p>我会从《本科生综合考评实施细则》中检索相关条款，整理成结构化答案并附上引用出处。</p>
        <div class="examples">
          <button class="example-chip" data-question="综合素质测评包含哪些部分？">综合素质测评包含哪些部分？</button>
          <button class="example-chip" data-question="参加学科竞赛获奖可以加多少分？">参加学科竞赛获奖可以加多少分？</button>
          <button class="example-chip" data-question="旷课会扣多少分？">旷课会扣多少分？</button>
          <button class="example-chip" data-question="综测总分如何计算？">综测总分如何计算？</button>
        </div>
      </div>
    </main>

    <footer class="input-bar">
      <form id="input-form" class="input-form">
        <textarea id="question-input" rows="1" placeholder="例如：参加学科竞赛获奖可以加多少分？（Enter 发送，Shift+Enter 换行）"></textarea>
        <button id="send-btn" type="submit" title="发送" aria-label="发送">➤</button>
      </form>
      <p class="disclaimer">回答由 AI 基于综测规则文档生成，仅供参考，请以学院正式发文为准。</p>
    </footer>
  </div>

  <!-- markdown.js / api.js / app.js 均无外部依赖；接口层集中在 api.js，后端就绪后只需改它 -->
  <script src="markdown.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
